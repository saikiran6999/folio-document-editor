# Example deployment manifest; check the host's current free-tier terms.
# WARNING: SQLite on an ephemeral host does not survive instance replacement.
services:
  - type: web
    name: folio-docs-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
